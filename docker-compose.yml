# Local development stands in for the Vault Agent sidecar by mounting
# ./dev/sample-secrets.json where the agent would render /vault/secrets/app.json.
x-var:
  - &node-image node:22

services:
  backend:
    container_name: backend
    entrypoint: sh -c "npm i && npm run start:dev"
    environment:
      NODE_ENV: development
      VAULT_SECRETS_FILE: /vault/secrets/app.json
      VAULT_SECRET_PATH: apps/dev/oscar-example/nodejs-sample/sample
    image: *node-image
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
    working_dir: "/app"
    volumes:
      - "./backend:/app"
      - "/app/node_modules"
      - "./dev/sample-secrets.json:/vault/secrets/app.json:ro"

  frontend:
    container_name: frontend
    entrypoint: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      BACKEND_URL: http://backend:3000
      PORT: 3000
      NODE_ENV: development
    image: *node-image
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    working_dir: "/app"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    container_name: caddy
    profiles: ["caddy"]
    build: ./frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_URL: http://backend:3000
      LOG_LEVEL: info
    ports: ["3005:3000"]
    volumes: ["./frontend/Caddyfile:/etc/caddy/Caddyfile"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    depends_on:
      backend:
        condition: service_healthy
