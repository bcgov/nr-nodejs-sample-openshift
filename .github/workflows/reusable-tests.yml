name: Reusable Tests

on:
  workflow_call:
    inputs:
      ### Required
      target:
        description: PR number, test or prod
        default: ${{ github.event.number }}
        type: string

env:
  DOMAIN: apps.gold.devops.gov.bc.ca
  PREFIX: ${{ github.event.repository.name }}-${{ inputs.target }}

permissions: {}

jobs:
  smoke-tests:
    name: Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: https://${{ github.event.repository.name }}-${{ inputs.target }}.apps.gold.devops.gov.bc.ca
    steps:
      - name: Wait for backend health check
        run: |
          echo "Waiting for backend health check at ${BASE_URL}/api/health..."
          for i in {1..30}; do
            status=$(curl -k --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/health" || true)
            if [ "$status" -eq 200 ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for health check (HTTP $status), retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "ERROR: Backend did not become healthy in time."
          exit 1

      - name: Hello world endpoint
        run: |
          body=$(curl -sf --max-time 10 "${BASE_URL}/api")
          echo "${body}"
          [ "${body}" = "Hello World!" ]

      # Confirms the Vault Agent sidecar rendered the secrets file. Values are
      # never returned by the API, so only metadata is asserted here.
      - name: Vault secret injection
        run: |
          body=$(curl -sf --max-time 10 "${BASE_URL}/api/v1/secrets")
          echo "${body}"
          echo "${body}" | jq -e '.available == true and (.secrets | length) > 0'

  e2e-tests:
    name: E2E
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        name: Checkout
      - uses: actions/setup-node@v7
        name: Setup Node
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Tests
        env:
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}/
          CI: "true"
        run: |
          npx playwright test --project="chromium" --reporter=html

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        name: upload results
        with:
          name: playwright-report-chromium
          path: "./frontend/playwright-report" # path from current folder
          retention-days: 7
