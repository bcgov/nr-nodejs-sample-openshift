apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: CPU_REQUEST
    value: "100m"
  - name: MEMORY_REQUEST
    value: "128Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "4Gi"
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: "info"
  - name: VAULT_IMAGE
    description: Image providing the Vault Agent binary
    value: docker.io/hashicorp/vault:2.0.4
  - name: VAULT_ADDR
    description: Vault (Knox) API address
    value: https://knox.io.nrs.gov.bc.ca
  - name: VAULT_AUTH_PATH
    description: AppRole auth mount used by the service login
    value: auth/vs_apps_approle
  - name: VAULT_MOUNT
    description: KV v2 secret engine mount
    value: apps
  - name: VAULT_SECRET_PATH
    description: KV v2 path within the mount, without the "data" segment
    value: dev/oscar-example/nodejs-sample/proxy-account-ready-only
  - name: VAULT_APPROLE_SECRET
    description: >-
      Secret holding the AppRole login, pre-provisioned and rotated by the
      NR Broker provision-secret CronJob. Never created by this template.
    value: knox-secret
  - name: VAULT_ROLE_ID_KEY
    value: role_id
  - name: VAULT_SECRET_ID_KEY
    value: secret_id
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-vault-agent
    data:
      agent.hcl: |-
        pid_file = "/vault/agent/pid"

        vault {
          address = "${VAULT_ADDR}"
          retry {
            num_retries = 5
          }
        }

        auto_auth {
          method "approle" {
            mount_path = "${VAULT_AUTH_PATH}"
            # Cap login/template retry backoff well below the 5m default so a
            # single transient failure on pod startup doesn't stall readiness.
            min_backoff = "1s"
            max_backoff = "10s"
            config = {
              role_id_file_path                   = "/vault/approle/${VAULT_ROLE_ID_KEY}"
              secret_id_file_path                 = "/vault/approle/${VAULT_SECRET_ID_KEY}"
              remove_secret_id_file_after_reading = false
            }
          }

          # No token sink: the app only ever sees rendered secrets, not a token.
        }

        template {
          destination = "/vault/secrets/app.json"
          perms       = "0400"
          contents    = <<-EOT
            {{- with secret "${VAULT_MOUNT}/data/${VAULT_SECRET_PATH}" -}}
            {{ .Data.data | toJSON }}
            {{- end -}}
          EOT
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-ingress
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
      policyTypes:
        - Ingress
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: vault-agent
              image: ${VAULT_IMAGE}
              imagePullPolicy: IfNotPresent
              command: ["vault", "agent", "-config=/vault/config/agent.hcl"]
              env:
                - name: HOME
                  value: /vault/agent
                - name: VAULT_ADDR
                  value: ${VAULT_ADDR}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: vault-config
                  mountPath: /vault/config
                  readOnly: true
                - name: vault-approle
                  mountPath: /vault/approle
                  readOnly: true
                - name: vault-secrets
                  mountPath: /vault/secrets
                - name: vault-agent
                  mountPath: /vault/agent
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: VAULT_SECRETS_FILE
                  value: /vault/secrets/app.json
                - name: VAULT_SECRET_PATH
                  value: ${VAULT_MOUNT}/${VAULT_SECRET_PATH}
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: vault-secrets
                  mountPath: /vault/secrets
                  readOnly: true
              startupProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /api
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    # distroless/nodejs has no /bin/sleep; exec hooks skip image ENTRYPOINT
                    command: ["/nodejs/bin/node", "-e", "setTimeout(() => {}, 10000)"]
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: vault-config
              configMap:
                name: ${NAME}-${ZONE}-${COMPONENT}-vault-agent
            - name: vault-approle
              secret:
                secretName: ${VAULT_APPROLE_SECRET}
                items:
                  - key: ${VAULT_ROLE_ID_KEY}
                    path: ${VAULT_ROLE_ID_KEY}
                  - key: ${VAULT_SECRET_ID_KEY}
                    path: ${VAULT_SECRET_ID_KEY}
            - name: vault-secrets
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            - name: vault-agent
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
